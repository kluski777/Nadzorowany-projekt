<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space Inpainter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #4a90d9;
            background: rgba(74, 144, 217, 0.1);
        }

        .upload-area.dragover {
            border-color: #4a90d9;
            background: rgba(74, 144, 217, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(74, 144, 217, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-section {
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        .images-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .image-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .image-box h3 {
            margin-bottom: 15px;
            color: #fff;
            font-size: 1.1rem;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ff6b6b;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        .filename {
            color: #4a90d9;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .images-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Latent Space Inpainter</h1>
        <p class="subtitle">Upload a masked image to reconstruct the missing parts</p>

        <div class="upload-section">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <p class="upload-text">Drop your image here or click to browse</p>
                    <p class="upload-hint">Supports JPG, PNG, WebP</p>
                    <p class="filename" id="filename"></p>
                </div>
                <input type="file" id="imageInput" name="image" accept="image/*">
                <div style="text-align: center;">
                    <button type="submit" class="btn" id="submitBtn" disabled>
                        Reconstruct Image
                    </button>
                </div>
            </form>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing image through the neural network...</p>
            </div>
        </div>

        <div class="results-section" id="results">
            <div class="images-container">
                <div class="image-box">
                    <h3>Original (Masked)</h3>
                    <img id="originalImage" src="" alt="Original image">
                </div>
                <div class="image-box">
                    <h3>Reconstructed</h3>
                    <img id="resultImage" src="" alt="Reconstructed image">
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const filename = document.getElementById('filename');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');

        // Click to upload
        uploadArea.addEventListener('click', () => imageInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                imageInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        // File selected
        imageInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            if (imageInput.files.length > 0) {
                const file = imageInput.files[0];
                filename.textContent = file.name;
                submitBtn.disabled = false;

                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    originalImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!imageInput.files.length) return;

            // Show loading, hide others
            loading.classList.add('visible');
            error.classList.remove('visible');
            results.classList.remove('visible');
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', imageInput.files[0]);

            try {
                const response = await fetch('/inpaint', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Unknown error occurred');
                }

                // Get the result image
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                resultImage.src = imageUrl;

                // Show results
                results.classList.add('visible');

            } catch (err) {
                error.textContent = err.message;
                error.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
