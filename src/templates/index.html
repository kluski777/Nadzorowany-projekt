<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Space Inpainter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            gap: 24px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .slider-value {
            min-width: 40px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 2px dashed var(--border-color);
            overflow: hidden;
            transition: border 0.2s ease;
        }

        .canvas-wrapper.has-image {
            border: 2px solid transparent;
        }

        .canvas-wrapper.dragover {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .canvas-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .canvas-wrapper.has-image .canvas-container {
            pointer-events: auto;
        }

        #imageCanvas,
        #maskCanvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
        }

        #imageCanvas {
            z-index: 1;
        }

        #maskCanvas {
            z-index: 2;
            cursor: crosshair;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            cursor: pointer;
            padding: 40px;
            text-align: center;
            transition: color 0.2s ease;
        }

        .upload-placeholder:hover {
            color: var(--text-secondary);
        }

        .upload-placeholder.hidden {
            display: none;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            border: 2px dashed rgba(99, 102, 241, 0.3);
        }

        .upload-text {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        .result-item {
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
        }

        .result-label {
            padding: 10px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .result-image {
            width: 100%;
            display: block;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        /* Error Toast */
        .error-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #ef4444;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.875rem;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .error-toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="controls">
            <span class="control-label">Brush Size</span>
            <div class="slider-group">
                <input type="range" class="slider" id="brushSize" min="5" max="100" value="30">
                <span class="slider-value" id="brushSizeValue">30px</span>
            </div>
        </div>
        <button class="btn btn-primary" id="reconstructBtn" disabled>
            ✨ Reconstruct
        </button>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area">
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="upload-placeholder" id="uploadPlaceholder">
                <div class="upload-icon">📤</div>
                <p class="upload-text">Drop image or click to upload</p>
                <p class="upload-hint">JPG, PNG, WebP</p>
            </div>
            <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">🎉 Reconstruction Complete</span>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Original (masked)</div>
                        <img class="result-image" id="resultOriginal" src="" alt="Original">
                    </div>
                    <div class="result-item">
                        <div class="result-label">Reconstructed</div>
                        <img class="result-image" id="resultReconstructed" src="" alt="Reconstructed">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalClose2">Close</button>
                <button class="btn btn-primary" id="downloadResult">📥 Download</button>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="errorToast"></div>
    <input type="file" id="fileInput" accept="image/*">

    <script>
        const canvasWrapper = document.getElementById('canvasWrapper');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const imageCanvas = document.getElementById('imageCanvas');
        const maskCanvas = document.getElementById('maskCanvas');
        const imageCtx = imageCanvas.getContext('2d');
        const maskCtx = maskCanvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const brushSizeSlider = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const reconstructBtn = document.getElementById('reconstructBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultModal = document.getElementById('resultModal');
        const resultOriginal = document.getElementById('resultOriginal');
        const resultReconstructed = document.getElementById('resultReconstructed');
        const downloadResultBtn = document.getElementById('downloadResult');
        const errorToast = document.getElementById('errorToast');

        let currentImage = null;
        let isDrawing = false;
        let brushSize = 30;
        let lastX = 0, lastY = 0;
        let resultImageBlob = null;

        // Upload handlers
        uploadPlaceholder.addEventListener('click', () => fileInput.click());
        canvasWrapper.addEventListener('click', (e) => {
            if (!currentImage) fileInput.click();
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Drag and drop
        canvasWrapper.addEventListener('dragover', (e) => {
            e.preventDefault();
            canvasWrapper.classList.add('dragover');
        });
        canvasWrapper.addEventListener('dragleave', () => canvasWrapper.classList.remove('dragover'));
        canvasWrapper.addEventListener('drop', (e) => {
            e.preventDefault();
            canvasWrapper.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        // Brush size
        brushSizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            brushSizeValue.textContent = brushSize + 'px';
        });

        // Drawing
        maskCanvas.addEventListener('mousedown', startDrawing);
        maskCanvas.addEventListener('mousemove', draw);
        maskCanvas.addEventListener('mouseup', stopDrawing);
        maskCanvas.addEventListener('mouseout', stopDrawing);

        // Touch
        maskCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = maskCanvas.getBoundingClientRect();
            startDrawing({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top });
        });
        maskCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = maskCanvas.getBoundingClientRect();
            draw({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top });
        });
        maskCanvas.addEventListener('touchend', stopDrawing);

        // Actions
        reconstructBtn.addEventListener('click', reconstruct);
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalClose2').addEventListener('click', closeModal);
        downloadResultBtn.addEventListener('click', downloadResult);
        resultModal.addEventListener('click', (e) => { if (e.target === resultModal) closeModal(); });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    setupCanvas(img);
                    reconstructBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setupCanvas(img) {
            const wrapper = canvasWrapper;
            const maxSize = Math.min(wrapper.clientWidth - 32, wrapper.clientHeight - 32);
            let width = img.width, height = img.height;
            if (width > maxSize || height > maxSize) {
                const ratio = Math.min(maxSize / width, maxSize / height);
                width = Math.floor(width * ratio);
                height = Math.floor(height * ratio);
            }
            imageCanvas.width = width;
            imageCanvas.height = height;
            maskCanvas.width = width;
            maskCanvas.height = height;
            imageCtx.drawImage(img, 0, 0, width, height);
            maskCtx.clearRect(0, 0, width, height);
            uploadPlaceholder.classList.add('hidden');
            canvasWrapper.classList.add('has-image');
        }

        function startDrawing(e) {
            if (!currentImage) return;
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            const scaleX = maskCanvas.width / maskCanvas.offsetWidth;
            const scaleY = maskCanvas.height / maskCanvas.offsetHeight;
            const x = e.offsetX * scaleX, y = e.offsetY * scaleY;
            const lx = lastX * scaleX, ly = lastY * scaleY;

            maskCtx.beginPath();
            maskCtx.moveTo(lx, ly);
            maskCtx.lineTo(x, y);
            maskCtx.lineWidth = brushSize;
            maskCtx.lineCap = 'round';
            maskCtx.lineJoin = 'round';
            maskCtx.strokeStyle = '#000000';
            maskCtx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }

        function stopDrawing() { isDrawing = false; }

        function getMergedCanvas() {
            const merged = document.createElement('canvas');
            merged.width = imageCanvas.width;
            merged.height = imageCanvas.height;
            const ctx = merged.getContext('2d');
            ctx.drawImage(imageCanvas, 0, 0);
            ctx.drawImage(maskCanvas, 0, 0);
            return merged;
        }

        async function reconstruct() {
            loadingOverlay.classList.add('visible');
            try {
                const merged = getMergedCanvas();
                const blob = await new Promise(r => merged.toBlob(r, 'image/png'));
                const formData = new FormData();
                formData.append('image', blob, 'masked.png');

                const response = await fetch('/inpaint', { method: 'POST', body: formData });
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Unknown error');
                }

                resultImageBlob = await response.blob();
                resultOriginal.src = merged.toDataURL('image/png');
                resultReconstructed.src = URL.createObjectURL(resultImageBlob);
                loadingOverlay.classList.remove('visible');
                resultModal.classList.add('visible');
            } catch (err) {
                loadingOverlay.classList.remove('visible');
                showError(err.message);
            }
        }

        function closeModal() { resultModal.classList.remove('visible'); }

        function downloadResult() {
            if (!resultImageBlob) return;
            const link = document.createElement('a');
            link.download = 'reconstructed.png';
            link.href = URL.createObjectURL(resultImageBlob);
            link.click();
        }

        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.classList.add('visible');
            setTimeout(() => errorToast.classList.remove('visible'), 4000);
        }
    </script>
</body>

</html>
