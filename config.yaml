splits:
  seed: 42  # seed for split generation
  total_samples: null  # null to use full dataset (~100k images)
  val_split: 0.1
  test_split: 0.1

data:
  batch_size: 128
  num_workers: 3
  image_size: 256
  shuffle_buffer_size: 10000
  data_dir: "./data"
  splits_dir: "splits"  # Directory name relative to data_dir where splits are stored

cutting:
  enable: true
  mode_train: "random"
  mode_val: "reproducible"
  mode_test: "reproducible"
  seed: null  # null to use experiment.seed

model:
  input_channels: 3
  latent_channels: 16  # 16 * 8 * 8
  learning_rate: 0.001
  loss_type: "ms_ssim"  # Options: "ssim", "ms_ssim"

training:
  max_epochs: 150
  gradient_clip_val: 1.0
  early_stopping_patience: 10
  lr_scheduler_patience: 5
  lr_scheduler_factor: 0.5

experiment:
  name: "autoencoder-77553-full-ms_ssim-gauss-1k"
  seed: 42  # Seed for training reproducibility
  visualization_samples: 8
  recon_log_every_n_epochs: 5
